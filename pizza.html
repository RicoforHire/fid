<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Black Goose Bistro: Pizza-on-Demand</title>
    <style type="text/css">
        ol, ul { list-style-type: none; }
    </style>
</head>
<body>
    <h1>Black Goose Bistro | Pizza-on-Demand</h1>
    <p>
        "Our 12" wood-fired pizzas are available for delivery. Build a custom pizza of your liking and we'll deliver it to you."
    </p>

        <fieldset>
            <legend>Your Info</legend>
            <ul>
                <li>
                    <label for="form-name">Name:</label>
                    <input type="text" name="customername" id="form-name">
                </li>
                <li>
                    <label for="form-address">Address:</label>
                    <input type="text" name="address" id="form-address">
                </li>
                <li>
                    <label for="form-telephone-number">Telephone Number:</label>
                    <input type="tel" name="telephone" id="form-telephone-number">
                </li>
                <li>
                    <label for="form-email">Email:</label>
                    <input type="email" name="email" id="form-email">
                </li>
                <li>
                    <label for="form-delivery-instructions">Delivery instructions:</label>
                    <br>
                    <textarea name="instructions" rows="4" cols="60"
                        placeholder="No more than 400 characters long."
                        maxlength="400" id="form-delivery-instructions"></textarea>
                </li>
            </ul>
        </fieldset>
    </form>
    <h2>Design Your Pizza:</h2>
<fieldset>
    <legend>Pizza specs</legend>
    <fieldset>
        <legend>
            "Crust "
            <em>(Choose one)</em>
            ":"
        </legend>
        <ul>
            <li>
                <label>
                    <input type="radio" name="crust" value="white">
                    " Classic white"
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="crust" value="multigrain">
                    " Multigrain"
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="crust" value="cheese-stuffed">
                    " Cheese-stuffed crust"
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="crust" value="gluten-free">
                    " Gluten-free"
                </label>
            </li>
        </ul>
    </fieldset>
</fieldset>
<li>
  <label>
    <input type="checkbox" name="toppings[]" value="peppers">
    " Peppers"
  </label>
</li>
<li>
  <label>
    <input type="checkbox" name="toppings[]" value="anchovies">
    " Anchovies"
  </label>
</li>
</ul>
</fieldset>
<fieldset>
  <legend>Number</legend>
  <p>
    <label for="form-pizzas">How many pizzas:</label>
    <select name="pizzas" id="form-pizzas" size="1">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
    </select>
  </p>
</fieldset>
</fieldset>
<input type="submit" value="Confirm order">
</form>
</body>
</html>
